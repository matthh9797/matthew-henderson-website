projects:
- name: Analytics Orchestration Modernisation
  summary: |
    Modernised the orchestration of analytical data pipelines by establishing a dedicated Apache Airflow environment for the Advanced Analytics team and migrating dbt execution from a legacy orchestration setup to Astronomer Cosmos.

    The project involved designing a new repository and containerised execution environment, integrating dbt models with Airflow and establishing independently managed deployment workflows.

    A key objective was to give the analytics team greater ownership of its data pipelines while improving maintainability and reducing dependencies on shared infrastructure.

    The resulting architecture provides a more flexible foundation for managing, deploying and monitoring analytical transformations.
  tags: ["professional", "Veriff", "Apache Airflow", "Astronomer Cosmos", "dbt", "Docker", "Python"]

- name: Enterprise Semantic Layer
  summary: |
    Led an initiative to evaluate and introduce a centralised semantic layer using Cube, with the aim of improving consistency in analytical metrics and simplifying access to business data.

    Developed a proof of concept integrating Cube with the existing data warehouse, exploring reusable metric definitions, pre-aggregations and integration with business intelligence tools.

    The project also explored AI-assisted analytical querying, investigating how a semantic layer could provide a governed interface between business data and natural-language analytical applications.

    Authored a technical RFC documenting the proposed architecture, implementation considerations and trade-offs, providing a foundation for further evaluation and adoption.
  tags: ["professional", "Veriff", "Cube", "Amazon Redshift", "SQL", "Tableau", "AI integrations"]

- name: Fraud Risk Analytics
  summary: |
    Developed analytical data models to support the evaluation and comparison of fraud risk scoring systems used within identity verification workflows.

    The work focused on structuring complex verification data to enable consistent analysis of different fraud detection approaches, including global, network and device-based risk scoring models.

    Applied dimensional modelling principles to represent verification events, fraud signals and analytical outcomes, supporting comparisons of model effectiveness and investigation of overlapping detection mechanisms.

    The resulting models provide a foundation for understanding the contribution of different fraud detection signals and supporting data-driven decisions about fraud prevention strategies.
  tags: ["professional", "Veriff", "SQL", "dbt", "Amazon Redshift", "Dimensional Modelling"]

- name: Production LLM Services
  summary: |
    Developed and improved production LLM-powered services used to extract and structure information from construction industry data.

    The services supported a range of information processing tasks, including email classification, construction project phase extraction and automated generation of article titles and summaries.

    The work involved integrating language models into existing processing workflows, handling structured outputs and improving the consistency and reliability of automated extraction.

    These services formed part of a broader data processing architecture designed to transform large volumes of unstructured information into useful, structured construction intelligence.
  tags: ["professional", "Building Radar", "Python", "LLMs", "APIs", "Structured Outputs"]

- name: LLM Evaluation Framework
  summary: |
    Developed a centralised proof-of-concept framework for evaluating the quality and reliability of production LLM services.

    The framework used Langfuse to support structured evaluation workflows, combining LLM-as-judge techniques with deterministic and quantitative metrics to assess generated outputs.

    The objective was to establish a reusable approach to measuring model performance, identifying quality regressions and comparing changes across different LLM-powered applications.

    By separating evaluation logic from individual services, the project explored a more consistent and maintainable approach to validating LLM behaviour throughout the development lifecycle.
  tags: ["professional", "Building Radar", "Python", "Langfuse", "LLM-as-Judge", "Evaluation Metrics"]

- name: GCP Multi-Tenancy
  # logo: /images/sections/skills/dbt.svg
  role: Owner
  timeline: "Jan 2025 - Mar 2025"
  # repo: https://github.com/hossainemruz/toha
  summary: >
    To support the transition from a single-client setup to a multi-client model, I built a centralized Terraform repository for our analytics infrastructure on GCP.
    Working closely with Google’s DevOps team, I implemented CI/CD using Cloud Build to automate and standardize environment creation.
    This transformation allowed us to scale efficiently, spin up client-specific environments with ease, and significantly improved the reliability of our cloud infrastructure.

  tags: ["professional", "Jetty Technologies", "GCP", "Terraform", "Cloud Build"]

- name: Proactive Data Quality Monitoring
  # logo: /images/sections/skills/dbt.svg
  role: Owner
  timeline: "Nov 2024 - Dec 2024"
  # repo: https://github.com/hossainemruz/toha
  summary: >
    To address persistent data quality issues, I implemented the dq-utils dbt package to log failing test results and link them to the original source data.
    I then built a Looker dashboard that provided real-time visibility into data issues, trend analysis, row-level drilldowns, and Jira integration for issue tracking.
    This solution enabled proactive data ownership, alerting system owners when quality thresholds were breached, significantly improving the overall reliability of our data.

  tags: ["professional", "Jetty Technologies", "dbt", "JIRA", "Looker"]

- name: Trade Statistics Dashboard
  # logo: /images/sections/skills/dbt.svg
  role: Owner
  timeline: "Aug 2024 - Sep 2024"
  # repo: https://github.com/hossainemruz/toha
  summary: >
    I designed and built a unified data model in dbt to consolidate all customer "trade" events, including sales, package changes, and churn, into a single source of truth.
    Collaborating with operational teams, I mapped user journeys to define event logic, implemented rigorous testing and documentation, and created a Looker dashboard that
    now serves as a trusted operational reporting tool. This solution enables the business to track customer movement,
    identify underperforming sales channels, and make data-driven decisions with confidence.
  tags: ["professional", "Jetty Technologies", "GCP", "dbt", "Looker"]


- name: BEAM Modelling Process
  # logo: /images/sections/skills/dbt.svg
  role: Owner
  timeline: "Feb 2024 - Feb 2024"
  # repo: https://github.com/hossainemruz/toha
  summary: >
    To address inconsistent and duplicated reporting requests, I developed a lightweight intake process based on BEAM data modeling principles.
    This involved collaborative sessions with stakeholders to define key user stories and metrics, an Excel mock dataset to map expected dimensions, and an ER model to assess feasibility.
    The process improved clarity, reduced duplicate requests, and enabled better prioritisation — ultimately streamlining reporting workflows and strengthening alignment between data and business teams.
  tags: ["professional", "Jetty Technologies", "BEAM", "ERD Editor"]

