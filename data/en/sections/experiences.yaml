- company:
    name: Jetty Technologies
    url: "https://www.jettytechnologies.com/"
    location: UK, Remote
    # company overview
    overview: |
      Designed and developed a cloud-native analytics platform on Google Cloud, covering the full data lifecycle from ingestion and orchestration to transformation, dimensional modelling and business intelligence.

      Focused on creating reliable, maintainable and cost-effective infrastructure while enabling internal teams and customers to access consistent analytical data.
