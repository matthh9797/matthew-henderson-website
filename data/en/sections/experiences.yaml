# Your experiences
experiences:
- company:
    name: Veriff
    location: Barcelona, Spain
    overview: |
      Working within the Advanced Analytics team, developing and improving the infrastructure, data models and analytical tools that support business intelligence and fraud analytics.

      My work spans data platform engineering, orchestration, dimensional modelling and semantic layer development, with a focus on improving the reliability, maintainability and accessibility of analytical data.
    technologies:
    - Python
    - SQL
    - dbt
    - Apache Airflow
    - Astronomer Cosmos
    - Docker
    - Amazon Redshift
    - Cube
    - Tableau
    - Elementary
  positions:
  - designation: Senior Analytics Engineer
    start: Oct 2026
    responsibilities:
    - Modernised analytics orchestration by establishing a dedicated Apache Airflow environment and migrating dbt execution to Astronomer Cosmos, enabling independent deployment and ownership of analytical workflows.
    - Led the evaluation and introduction of Cube as a semantic layer, developing a proof of concept for centralised metrics, pre-aggregations and AI-assisted analytical querying.
    - Improved analytical data quality by introducing Elementary, strengthening dbt testing practices and promoting Kimball dimensional modelling principles.
    - Developed analytical models supporting the evaluation and comparison of fraud risk scoring systems across different fraud detection signals.
  - designation: Analytics Engineer
    start: Jan 2026
    end: Oct 2026
    responsibilities:
    - Developed and maintained analytical data models supporting business intelligence and fraud analytics.
    - Contributed to data platform and orchestration improvements to make analytical workflows more reliable and maintainable.
    - Applied dimensional modelling principles to improve the consistency and accessibility of analytical data.

