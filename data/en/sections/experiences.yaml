    - dbt
    - Dagster
    - dlt
    - Looker
    - Terraform
    - Cloud Run
    - Pub/Sub
    - Cloud Build
  positions:
  - designation: Senior Data Engineer
    start: Oct 2024
    end: Jul 2025
    responsibilities:
    - Architected and developed an end-to-end analytics platform using Google Cloud, BigQuery, Dagster, dlt and dbt.
    - Built reusable ingestion pipelines integrating multiple business data sources into a central analytical warehouse.
    - Introduced dimensional modelling principles and star schemas to improve data consistency and simplify analytical consumption.
